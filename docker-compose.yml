services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ytgrid_api
    ports:
      - "8000:8000"
    environment:
      - YTGRID_API_KEY=${YTGRID_API_KEY:?Set YTGRID_API_KEY before running docker compose}
      - YTGRID_HEADLESS_MODE=True
      - YTGRID_DEFAULT_SPEED=1.0
      - YTGRID_DEFAULT_LOOP_COUNT=1
      - YTGRID_MAX_SESSIONS=10
      - YTGRID_USE_CELERY=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - YTGRID_DB_PATH=ytgrid.db
    volumes:
      - ./:/app
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ytgrid_worker
    environment:
      - YTGRID_API_KEY=${YTGRID_API_KEY:?Set YTGRID_API_KEY before running docker compose}
      - YTGRID_HEADLESS_MODE=True
      - YTGRID_USE_CELERY=True
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - YTGRID_DB_PATH=ytgrid.db
    volumes:
      - ./:/app
      - /dev/shm:/dev/shm
    depends_on:
      - redis

  redis:
    image: redis:6-alpine
    container_name: ytgrid_redis
    ports:
      - "6379:6379"
