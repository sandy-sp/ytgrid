name: 🐳 Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'ytgrid/**'
      - '.github/workflows/docker-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🚀 Build & Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 📦 Install Dependencies
        run: poetry install --no-interaction


      - name: 🐳 Log in to Docker Hub
        run: echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🔑 Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 🏗️ Build Docker Images
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKER_HUB_USERNAME }}"
          if [[ -z "$DOCKERHUB_USER" ]]; then
            echo "❌ ERROR: DOCKER_HUB_USERNAME is not set in GitHub Secrets!"
            exit 1
          fi
          docker build -f Dockerfile.api \
            -t "$DOCKERHUB_USER/ytgrid-api:latest" \
            -t "ghcr.io/${{ github.repository_owner }}/ytgrid-api:latest" \
            .
          docker build -f Dockerfile.worker \
            -t "$DOCKERHUB_USER/ytgrid-worker:latest" \
            -t "ghcr.io/${{ github.repository_owner }}/ytgrid-worker:latest" \
            .

      - name: 📤 Push to Docker Hub
        run: |
          DOCKERHUB_USER="${{ secrets.DOCKER_HUB_USERNAME }}"
          if [[ -z "$DOCKERHUB_USER" ]]; then
            echo "❌ ERROR: DOCKER_HUB_USERNAME is not set in GitHub Secrets!"
            exit 1
          fi
          docker push "$DOCKERHUB_USER/ytgrid-api:latest"
          docker push "$DOCKERHUB_USER/ytgrid-worker:latest"

      - name: 📤 Push to GitHub Container Registry
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/ytgrid-api:latest"
          docker push "ghcr.io/${{ github.repository_owner }}/ytgrid-worker:latest"
